<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#071c2e"/>
      <stop offset="100%" stop-color="#0a2a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6fffb"/>
      <stop offset="100%" stop-color="#9ff5e0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- subtle circuit grid -->
  <g stroke="#123045" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- glow behind router area -->
  <circle cx="930" cy="180" r="220" fill="url(#glow)"/>
  <circle cx="930" cy="180" r="120" fill="url(#greenGlow)"/>

  <!-- Wifi signal arcs emanating from router -->
  <g fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.85">
    <path d="M 850 250 A 120 120 0 0 1 1010 250" stroke-opacity="0.35"/>
    <path d="M 875 250 A 95 95 0 0 1 985 250" stroke-opacity="0.55"/>
    <path d="M 898 250 A 70 70 0 0 1 962 250" stroke-opacity="0.75"/>
    <path d="M 920 250 A 45 45 0 0 1 940 250" stroke-opacity="0.95"/>
  </g>
  <circle cx="930" cy="255" r="7" fill="#38bdf8"/>

  <!-- router body -->
  <rect x="880" y="255" width="100" height="20" rx="4" fill="#0f2a3a" stroke="#1f4a63" stroke-width="2"/>
  <circle cx="900" cy="265" r="3" fill="#34d399"/>
  <circle cx="915" cy="265" r="3" fill="#34d399"/>
  <circle cx="930" cy="265" r="3" fill="#f59e0b"/>

  <!-- unlocked padlock, revealing password -->
  <g transform="translate(1010,120)">
    <path d="M -20 10 A 20 20 0 0 1 5 -8" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <rect x="-30" y="10" width="60" height="46" rx="8" fill="#0e2536" stroke="#2dd4bf" stroke-width="2.5"/>
    <circle cx="0" cy="30" r="7" fill="#34d399"/>
    <path d="M 0 34 L -4 45 L 4 45 Z" fill="#34d399"/>
  </g>

  <!-- scan beam sweeping -->
  <rect x="700" y="205" width="380" height="6" fill="url(#beam)"/>

  <!-- password reveal glyphs, faux masked chars -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#5eead4" opacity="0.55">
    <text x="770" y="300">••••••</text>
    <text x="900" y="300">wifi_pass_9x</text>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700"
        fill="url(#textGrad)" textLength="900" lengthAdjust="spacingAndGlyphs">WiFi Password</text>
  <text x="60" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700"
        fill="url(#textGrad)" textLength="480" lengthAdjust="spacingAndGlyphs">Revealer</text>

  <!-- tagline -->
  <text x="60" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a7f3d0"
        textLength="920" lengthAdjust="spacingAndGlyphs">Reveals saved WiFi passwords with a lightweight scanner —</text>
  <text x="60" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a7f3d0"
        textLength="500" lengthAdjust="spacingAndGlyphs">single binary, no dependencies</text>
</svg>